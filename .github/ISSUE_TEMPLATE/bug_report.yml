name: Bug report
description: Report a reproducible problem in Core Framework.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include passwords, connection keys, private site URLs, project data, or security exploit details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Web app
        - WordPress plugin
        - Figma plugin
        - Gutenberg
        - Bricks
        - Oxygen
        - Generated CSS
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Change ...
        3. Save or synchronize ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Core Framework version or commit
      placeholder: 1.10.4 or commit SHA
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant WordPress, PHP, browser, builder, or Figma versions.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output with secrets and private data redacted.
    validations:
      required: false
