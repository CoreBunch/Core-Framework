name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          tools: composer

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Audit critical JavaScript dependencies
        run: bun audit --audit-level=critical

      - name: Install PHP development dependencies
        working-directory: packages/wp
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit PHP dependencies
        working-directory: packages/wp
        run: composer audit --locked --no-interaction

      - name: Test web application
        working-directory: packages/www
        run: bunx jest --coverage --detectOpenHandles --watchman=false

      - name: Test WordPress PHP
        working-directory: packages/wp
        run: vendor/bin/phpunit Tests

      - name: Lint WordPress PHP syntax
        run: find packages/wp -path packages/wp/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build web application
        run: bun run build:www

      - name: Build Figma plugin
        run: bun run build:figma

  package:
    name: Build WordPress Release
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          tools: composer

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build WordPress release
        run: bun run release:wp -- "${{ steps.version.outputs.version }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-framework-${{ steps.version.outputs.version }}
          path: .tmp/release/core-framework-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: package
    environment: wordpress-org
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: core-framework-${{ needs.package.outputs.version }}
          path: .tmp/release

      - name: Extract WordPress release
        run: |
          mkdir -p .tmp/release/deploy
          unzip -q ".tmp/release/core-framework-${{ needs.package.outputs.version }}.zip" \
            -d .tmp/release/deploy

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: core-framework
          VERSION: ${{ needs.package.outputs.version }}
          BUILD_DIR: .tmp/release/deploy/core-framework

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Core Framework ${{ needs.package.outputs.version }}" \
            --generate-notes

      - name: Upload WordPress ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            ".tmp/release/core-framework-${{ needs.package.outputs.version }}.zip" \
            --clobber
